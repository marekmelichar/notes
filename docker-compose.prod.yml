# Notes app. The edge proxy (nginx, certbot, TLS) lives in the nettio-platform repo;
# this project only joins its external 'edge' network.
name: notes

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: nettio-notes-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Keycloak Authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: nettio-auth
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      KC_HOSTNAME: https://notes.nettio.eu
      KC_HOSTNAME_ADMIN: https://auth.nettio.eu
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    command: start --import-realm
    volumes:
      - ./notes-prod-realm.json:/opt/keycloak/data/import/notes-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Also on the shared 'edge' network so the nettio-platform proxy can reach it.
    networks:
      default:
      edge:
        aliases: [notes-keycloak]

  # .NET API
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/api:latest
    container_name: nettio-notes-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=notes;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Keycloak__Authority: "http://keycloak:8080/realms/notes"
      Keycloak__Issuer: "https://notes.nettio.eu/realms/notes"
      ASPNETCORE_ENVIRONMENT: Production
      FileStorage__UploadDirectory: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    # Also on the shared 'edge' network so the nettio-platform proxy can reach it.
    networks:
      default:
      edge:
        aliases: [notes-api]

  # Frontend
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/frontend:latest
    container_name: nettio-notes-frontend
    environment:
      API_URL: "https://notes.nettio.eu"
      KEYCLOAK_URL: "https://notes.nettio.eu"
      KEYCLOAK_REALM: "notes"
      KEYCLOAK_CLIENT_ID: "notes-frontend"
    depends_on:
      - api
      - keycloak
    restart: unless-stopped
    # Also on the shared 'edge' network so the nettio-platform proxy can reach it.
    networks:
      default:
      edge:
        aliases: [notes-frontend]

volumes:
  # Pinned to the existing volumes (created when the project was called "nettio").
  # external: compose never creates or deletes them. Do NOT rename: an old, unused
  # "notes_postgres_data" volume exists and must never be attached by accident.
  postgres_data:
    name: nettio_postgres_data
    external: true
  uploads_data:
    name: nettio_uploads_data
    external: true

networks:
  # Created once on the VPS (docker network create edge); owned by nettio-platform.
  edge:
    external: true
