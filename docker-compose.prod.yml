# Notes app. The edge proxy (nginx, certbot, TLS) lives in the nettio-platform repo;
# this project only joins its external 'edge' network.
# Deployed by CI through a restricted VPS hook: it fetches this file for the current head of
# main from GitHub itself (VPS-manager repo, remote/notes-deploy-hook.sh).
name: notes

services:
  # PostgreSQL Database
  postgres:
    # Exact version + digest (the image running since 6 Nov 2026): deploys never pull a newer
    # Postgres by surprise ("postgres:16" did, recreating the DB). Upgrade deliberately.
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    container_name: nettio-notes-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # .NET API
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/api:latest
    container_name: nettio-notes-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=notes;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      # Shared login in the nettio-platform repo (realm "nettio"), reached over the edge network.
      Keycloak__Authority: "http://auth-keycloak:8080/realms/nettio"
      Keycloak__Issuer: "https://auth.nettio.eu/realms/nettio"
      ASPNETCORE_ENVIRONMENT: Production
      FileStorage__UploadDirectory: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Also on the shared 'edge' network so the nettio-platform proxy can reach it.
    networks:
      default:
      edge:
        aliases: [notes-api]

  # Frontend
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/frontend:latest
    container_name: nettio-notes-frontend
    environment:
      API_URL: "https://notes.nettio.eu"
      KEYCLOAK_URL: "https://auth.nettio.eu"
      KEYCLOAK_REALM: "nettio"
      KEYCLOAK_CLIENT_ID: "notes-frontend"
    depends_on:
      - api
    restart: unless-stopped
    # Also on the shared 'edge' network so the nettio-platform proxy can reach it.
    networks:
      default:
      edge:
        aliases: [notes-frontend]

volumes:
  # Pinned to the existing volumes (created when the project was called "nettio").
  # external: compose never creates or deletes them. Do NOT rename: an old, unused
  # "notes_postgres_data" volume exists and must never be attached by accident.
  postgres_data:
    name: nettio_postgres_data
    external: true
  uploads_data:
    name: nettio_uploads_data
    external: true

networks:
  # Created once on the VPS (docker network create edge); owned by nettio-platform.
  edge:
    external: true
